[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailrocket-representation-thesis"
version = "0.1.0"
description = "Analysis materials for RetailRocket customer representation research"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib==3.10.9",
  "classixclustering==1.5.1",
  "ExKMC==0.0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
